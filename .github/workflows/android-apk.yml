name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build sideloadable APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Generate Android project
        run: npx expo prebuild --platform android
        working-directory: mobile

      - name: Build APK
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
        working-directory: mobile/android

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wondersprout-android-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      
      - name: Publish latest APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          release_apk="$RUNNER_TEMP/WonderSprout.apk"
          cp "$apk" "$release_apk"
          tag="android-apk-latest"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$release_apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$tag" "$release_apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "WonderSprout Android APK" \
              --notes "Latest installable Android APK for WonderSprout. This debug-signed APK can be sideloaded on Android." \
              --target "$GITHUB_SHA" \
              --latest
          fi

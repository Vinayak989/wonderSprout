<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-label="A colorful solar system with orbiting planets and a sparkling comet">
  <defs>
    <radialGradient id="space"><stop stop-color="#435695"/><stop offset="1" stop-color="#252459"/></radialGradient>
    <linearGradient id="earth" x2="1" y2="1"><stop stop-color="#77e2d3"/><stop offset="1" stop-color="#4c83e8"/></linearGradient>
    <linearGradient id="saturn" x2="0" y2="1"><stop stop-color="#ffe59a"/><stop offset="1" stop-color="#e99c75"/></linearGradient>
  </defs>
  <style>
    .orbit-one { transform-box:fill-box;transform-origin:260px 160px;animation:orbit 18s linear infinite }
    .orbit-two { transform-box:fill-box;transform-origin:260px 160px;animation:orbit 26s linear infinite reverse }
    .planet-spin { transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite }
    .comet { animation:comet 5s ease-in-out infinite alternate }
    .twinkle { animation:twinkle 1.8s ease-in-out infinite alternate }
    @keyframes orbit { to{transform:rotate(360deg)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes comet { to{transform:translate(-28px,15px)} }
    @keyframes twinkle { to{opacity:.35;transform:scale(.65)} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important} }
  </style>
  <rect width="520" height="320" rx="26" fill="url(#space)"/>
  <g fill="#fff"><circle class="twinkle" cx="47" cy="57" r="3"/><circle class="twinkle" cx="101" cy="136" r="2" style="animation-delay:-.6s"/><circle class="twinkle" cx="167" cy="47" r="2.5" style="animation-delay:-1s"/><circle class="twinkle" cx="376" cy="45" r="3"/><circle class="twinkle" cx="464" cy="99" r="2" style="animation-delay:-.4s"/><circle class="twinkle" cx="455" cy="237" r="3" style="animation-delay:-1.2s"/><circle class="twinkle" cx="73" cy="252" r="2.5" style="animation-delay:-.9s"/><circle class="twinkle" cx="335" cy="274" r="2"/></g>
  <g fill="#ffd96d"><path d="m57 125 4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="m431 164 3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></g>
  <ellipse cx="260" cy="160" rx="106" ry="56" fill="none" stroke="#abb8fb" stroke-width="2" stroke-dasharray="5 7" opacity=".6"/>
  <ellipse cx="260" cy="160" rx="177" ry="92" fill="none" stroke="#a6b8ed" stroke-width="2" stroke-dasharray="5 8" opacity=".45"/>
  <circle cx="260" cy="160" r="41" fill="#ffad56"/><circle cx="260" cy="160" r="33" fill="#ffd66d"/>
  <path d="M243 145q15-13 27-2m-27 27q15 14 30 3" fill="none" stroke="#fff0a9" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  <g class="orbit-one">
    <circle cx="366" cy="160" r="16" fill="url(#earth)"/>
    <path d="M358 155q8-11 15-5l-3 7 7 5-4 7-9-3-3-6z" fill="#71ca8b"/>
    <circle cx="260" cy="104" r="11" fill="#c7a5fa"/>
  </g>
  <g class="orbit-two">
    <g class="planet-spin">
      <circle cx="437" cy="160" r="23" fill="url(#saturn)"/>
      <ellipse cx="437" cy="160" rx="36" ry="10" fill="none" stroke="#f7d5a5" stroke-width="7" transform="rotate(-17 437 160)"/>
      <ellipse cx="437" cy="160" rx="36" ry="10" fill="none" stroke="#b97a9f" stroke-width="2" transform="rotate(-17 437 160)"/>
      <path d="M420 153q17 8 34 0" fill="none" stroke="#fff0bd" stroke-width="4" opacity=".8"/>
    </g>
    <circle cx="260" cy="68" r="9" fill="#ff8c9f"/>
  </g>
  <g class="comet"><path d="M123 88q18-14 34-21" stroke="#a6e9ff" stroke-width="7" stroke-linecap="round" opacity=".6"/><circle cx="162" cy="62" r="9" fill="#e8fbff"/><path d="m161 46 2 9m13 7-9 2m-19-9 6 5" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>
  <path d="m308 245 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#ffdb73"/>
</svg>
